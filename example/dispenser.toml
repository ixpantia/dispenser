# Delay in seconds between polling for new images (default: 60)
delay = 60

[proxy]
enabled = true

# Configuration for the default dispenser network (optional)
# Uncomment to customize the subnet and gateway for the default network
# [default_network]
# subnet = "10.10.0.0/16"
# gateway = "10.10.0.1"

[telemetry]
enabled = true
base_uri = "telem"

[[service]]
path = "service1"

[[service]]
path = "service2"

[[service]]
path = "hello-world"
